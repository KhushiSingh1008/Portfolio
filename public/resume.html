<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Khushi Singh | Resume</title>
    <style>
      :root {
        --bg-paper: #faf6f0;
        --ink-blue: #1d3557;
        --ink-blue-muted: #5c7a99;
        --border-sand: #e4dcd0;
        --text-ink: #1c2541;
        --text-muted: #7a736a;
      }

      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        min-height: 100%;
        background: var(--bg-paper);
        color: var(--text-ink);
        font-family: Inter, "Segoe UI", sans-serif;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px 20px;
      }

      .resume-shell {
        width: min(1100px, 100%);
        background: rgba(255,255,255,0.55);
        border: 1px solid var(--border-sand);
        border-radius: 18px;
        box-shadow: 0 18px 42px rgba(28,37,65,0.08);
        overflow: hidden;
      }

      .resume-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 18px 24px;
        border-bottom: 1px solid var(--border-sand);
        background: rgba(29,53,87,0.04);
      }

      .resume-header h1 {
        margin: 0;
        font-size: clamp(1.2rem, 2vw, 1.8rem);
        color: var(--ink-blue);
        font-family: Georgia, "Times New Roman", serif;
      }

      .resume-actions {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }

      .resume-actions a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 10px 16px;
        border-radius: 10px;
        text-decoration: none;
        font-weight: 600;
        color: var(--ink-blue);
        border: 1px solid var(--border-sand);
        background: rgba(29,53,87,0.04);
      }

      .resume-actions a.primary {
        background: var(--ink-blue);
        color: white;
        border-color: var(--ink-blue);
      }

      .viewer {
        width: 100%;
        height: calc(100vh - 170px);
        min-height: 720px;
        background: white;
      }

      iframe {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
      }

      .fallback {
        width: 100%;
        min-height: 720px;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 32px;
        text-align: center;
        color: var(--text-muted);
      }

      .fallback.visible {
        display: flex;
      }

      .fallback-card {
        max-width: 560px;
        background: rgba(29,53,87,0.03);
        border: 1px solid var(--border-sand);
        border-radius: 16px;
        padding: 28px 24px;
      }

      .fallback strong {
        display: block;
        margin-bottom: 10px;
        color: var(--ink-blue);
        font-size: 1.2rem;
      }
    </style>
  </head>
  <body>
    <div class="resume-shell">
      <div class="resume-header">
        <h1>Resume</h1>
        <div class="resume-actions">
          <a class="primary" href="/resume.pdf" target="_blank" rel="noopener noreferrer">Open PDF</a>
          <a href="/">Back to portfolio</a>
        </div>
      </div>

      <div class="viewer" id="viewer">
        <iframe id="resume-frame" title="Resume viewer" src="/resume.pdf" onerror="showFallback()"></iframe>
      </div>

      <div class="fallback" id="fallback">
        <div class="fallback-card">
          <strong>Resume PDF is not uploaded yet</strong>
          Place your exported PDF in the public folder as <em>resume.pdf</em> and refresh this page.
        </div>
      </div>
    </div>

    <script>
      function showFallback() {
        document.getElementById('viewer').style.display = 'none';
        document.getElementById('fallback').classList.add('visible');
      }

      const frame = document.getElementById('resume-frame');
      frame.addEventListener('load', () => {
        try {
          const doc = frame.contentDocument || frame.contentWindow.document;
          if (!doc || !doc.body || doc.body.innerText.trim() === '') {
            showFallback();
          }
        } catch (error) {
          showFallback();
        }
      });
    </script>
  </body>
</html>
